<div class="auth-layout auth-layout--compact">
  <section class="auth-layout__form card">
    <h2>Create account</h2>
    <p class="auth-layout__sub">Register as a project manager to manage your own tasks.</p>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>Full name</span>
        <input type="text" formControlName="name" autocomplete="name" />
      </label>

      <label>
        <span>Alias (optional)</span>
        <input type="text" formControlName="alias" autocomplete="nickname" />
      </label>

      <label>
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">At least 8 characters required.</small>
        }
      </label>

      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-layout__footer">
      Already registered?
      <a routerLink="/login">Sign in</a>
    </p>
  </section>
</div>
